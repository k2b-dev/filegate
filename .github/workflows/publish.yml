name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Go build and vet
        run: go build ./... && go vet ./...
      - name: Go tests
        run: go test -count=1 ./...
      - name: full race suite
        run: make test-race
      - name: staticcheck
        run: |
          GOTOOLCHAIN=auto go install honnef.co/go/tools/cmd/staticcheck@latest
          out=$("$(go env GOPATH)/bin/staticcheck" ./... 2>&1)
          if echo "$out" | grep -q "matched no packages"; then
            echo "staticcheck saw no packages"
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo "staticcheck: clean"
      - name: Go vulnerability scan
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: SDK install, audit, build, and test
        working-directory: sdk/ts
        run: npm ci && npm audit --omit=dev && npm run build && bun test test
      - name: Documentation and portable skill
        run: |
          cd docs-site
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          cd ..
          diff -r skills/filegate docs-site/agent-skills/filegate
      - name: Container build
        run: docker build .
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --skip=publish --clean
      - name: Debian and Rocky Linux packages
        run: bash packaging/test-packages.sh

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1
      - name: Verify release coordinates
        working-directory: sdk/ts
        run: |
          test "$GITHUB_REPOSITORY" = "k2b-dev/filegate"
          test "$GITHUB_REF_NAME" = "v${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME%%.*}" = "v6"
          test "$(node -p "require('./package.json').name")" = "@k2b/filegate"
      - name: Read package metadata
        id: package
        working-directory: sdk/ts
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Set version from tag
        working-directory: sdk/ts
        run: npm version ${{ steps.package.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Install and build
        working-directory: sdk/ts
        run: npm install && npm run build
      - name: Publish
        working-directory: sdk/ts
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."
          else
            npm publish --provenance --access public
          fi

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5

      - name: Extract version and image name
        id: meta
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.meta.outputs.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.IMAGE_NAME }}:latest

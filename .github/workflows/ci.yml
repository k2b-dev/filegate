name: CI

# `gate` is the only required status check. It needs every other job and
# passes only when each one succeeded. Pull requests run it on the branch; the
# merge queue runs it again on the exact merge result and merges only when it
# passed, so main itself is not re-verified here.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: go build ./... && go vet ./... && go test -race -count=1 ./...
      # Distinct-UID ACL tests need root inside an isolated Linux container.
      - run: make test-linux
      - run: npm ci && bun run build && bun test test
        working-directory: sdk/ts
      - run: bun install --frozen-lockfile && bun run typecheck && bun run build
        working-directory: docs-site
      - run: diff -r skills/filegate docs-site/agent-skills/filegate
      - run: docker build .
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --skip=publish --clean
      - run: bash packaging/test-packages.sh
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  gate:
    if: always()
    needs: [verify, packages, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: go build ./... && go vet ./... && go test -race -count=1 ./...
      - run: npm ci && bun run build && bun test test
        working-directory: sdk/ts
      - run: bun install --frozen-lockfile && bun run typecheck && bun run build
        working-directory: docs-site
      - run: diff -r skills/filegate docs-site/agent-skills/filegate
      - run: docker build .
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

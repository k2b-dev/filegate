version: 2

project_name: filegate

builds:
  - id: filegate
    main: ./cmd/filegate
    binary: filegate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/k2b-dev/filegate/v6/cli.Version={{.Version}}

archives:
  - id: binaries
    ids:
      - filegate
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

nfpms:
  - id: packages
    package_name: filegate
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}{{ .ConventionalExtension }}"
    description: Filegate filesystem gateway
    maintainer: Valentin Kolb <valentinkolb@users.noreply.github.com>
    license: MIT
    vendor: filegate
    homepage: https://github.com/k2b-dev/filegate
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    overrides:
      deb:
        dependencies: [passwd, libc-bin, systemd]
      rpm:
        dependencies: [shadow-utils, glibc-common, systemd]
    ids:
      - filegate
    bindir: /usr/bin
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    contents:
      - src: packaging/config/conf.yaml
        dst: /etc/filegate/conf.yaml
        type: config|noreplace
        # Static settings; the separately provisioned token is never packaged.
        file_info:
          mode: 0640
          owner: root
          group: filegate
      - src: packaging/systemd/filegate.service
        dst: /lib/systemd/system/filegate.service
      - dst: /var/lib/filegate
        type: dir
      - dst: /var/log/filegate
        type: dir

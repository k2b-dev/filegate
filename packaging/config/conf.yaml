server:
  listen: "127.0.0.1:8080"
  public_url: "http://127.0.0.1:8080"
  # Explicit browser origins for scoped direct transfers. Empty disables CORS.
  allowed_origins: []
auth:
  token_file: /etc/filegate/token
state_dir: /var/lib/filegate
uploads:
  max_file_size: 10GiB
roots:
  - name: cloud
    path: /srv/filegate/cloud
    index: true
    versioning:
      enabled: true
      cooldown: 1m
      keep:
        last: 10
        daily: 30
        monthly: 12
  # Independent externally modified root; no index or history.
  # - name: shared
  #   path: /data/nfs
  #   index: false

[test]
# Registers Solid's JSX transform; without it every rendered page throws
# "React is not defined" under bun test.
preload = ["./test/preload.ts"]

# NOTE: run the suite with `bun run test`, not bare `bun test`.
# Each test file configures the admin differently (token-only, OIDC with an
# allowlist, OIDC-only) and the resolved environment is cached per process, so
# the files need one fresh global each. That is `--isolate`, which bunfig does
# not support, so it lives in the package.json test script.

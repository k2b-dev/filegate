services:
  filegate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./conf.yaml:/etc/filegate/conf.yaml:ro
      - ./token:/etc/filegate/token:ro
      - ./data:/data
      - ./state:/var/lib/filegate
# Configure roots under /data, state_dir=/var/lib/filegate and listen=0.0.0.0:8080.
# Prepare writable directories for container UID/GID 65532 before starting.
